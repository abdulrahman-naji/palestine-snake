<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدودة نيون ٢٠٢٦ - الإصدار الأسطوري</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #06060c !important;
            color: #f1f1f6 !important;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important;
            text-align: center !important;
            margin: 0 !important;
            padding: 10px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            min-height: 100vh !important;
            justify-content: center !important;
            overflow-x: hidden;
        }
        h1 { 
            margin: 0 0 10px 0 !important; 
            font-size: 28px !important; 
            font-weight: 900 !important;
            background: linear-gradient(45deg, #00ff66, #00ffff, #ff007f) !important;
            background-size: 200% auto !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        .scoreboard-container {
            display: flex !important;
            gap: 15px !important;
            font-size: 14px !important;
            font-weight: 700;
            margin-bottom: 10px !important;
            background: rgba(255, 255, 255, 0.03) !important;
            padding: 8px 20px !important;
            border-radius: 30px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.05);
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-container {
            position: relative !important;
            border-radius: 22px !important;
            padding: 4px !important;
            background: linear-gradient(135deg, #00ff66, #00ffff, #ff007f) !important;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
        }
        canvas {
            background-color: #030307 !important;
            border-radius: 18px !important;
            display: block !important;
            max-width: 100% !important;
            height: auto !important;
        }
        .overlay-screen {
            position: absolute !important;
            top: 4px !important; left: 4px !important; right: 4px !important; bottom: 4px !important;
            background-color: rgba(6, 6, 14, 0.94) !important;
            border-radius: 18px !important;
            display: flex;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            backdrop-filter: blur(8px);
            z-index: 10 !important;
        }
        #game-over-screen, #pause-screen { display: none; }
        
        h2 { font-size: 28px !important; margin: 0 0 10px 0 !important; font-weight: 800 !important; }
        #game-over-screen h2 { color: #ff3b30 !important; text-shadow: 0 0 15px rgba(255, 59, 48, 0.5); }
        #start-screen h2 { color: #00ff66 !important; text-shadow: 0 0 15px rgba(0, 255, 102, 0.5); }
        #pause-screen h2 { color: #00ffff !important; text-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
        
        p { font-size: 14px !important; margin: 0 0 15px 0 !important; color: #a0a0b0 !important; }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
        }
        .mode-btn.active {
            background: #00ff66;
            color: #000;
            font-weight: bold;
        }

        .controls {
            margin-top: 10px !important;
            display: flex !important;
            gap: 6px !important;
            justify-content: center !important;
            flex-wrap: wrap;
        }
        .controls button {
            background: rgba(255, 255, 255, 0.04) !important;
            color: #e1e1e8 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 6px 12px !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            border-radius: 10px !important;
            transition: all 0.2s ease;
        }
        .active-speed { 
            background: rgba(0, 255, 102, 0.15) !important; 
            border-color: #00ff66 !important;
            color: #00ff66 !important;
        }
        .action-btn {
            background: linear-gradient(45deg, #007ff7, #00c6ff) !important;
            border: none !important; 
            color: white !important;
            padding: 10px 25px !important; 
            font-size: 15px !important; 
            font-weight: 800 !important;
            border-radius: 12px !important;
            cursor: pointer !important;
            box-shadow: 0 0 15px rgba(0, 127, 247, 0.4);
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: scale(1.05); }

        .d-pad {
            margin-top: 15px !important;
            display: grid !important;
            direction: ltr !important;
            grid-template-columns: repeat(3, 58px) !important;
            grid-template-rows: repeat(3, 58px) !important;
            gap: 6px !important;
        }
        .d-btn {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #fff !important; 
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 16px !important; 
            font-size: 20px !important;
            display: flex !important; 
            justify-content: center !important; 
            align-items: center !important;
            cursor: pointer !important;
            transition: all 0.1s ease;
        }
        .d-btn:active {
            background: rgba(0, 255, 102, 0.3) !important;
            transform: scale(0.92);
        }
        .space-hint { margin-top: 6px; font-size: 11px; color: #888; }
    </style>
</head>
<body>

    <h1>لعبة الدودة نيون ٢٠٢٦</h1>
    
    <div class="scoreboard-container">
        <div>النقاط: <span id="score" style="color: #00ff66;">0</span></div>
        <div>الأعلى: <span id="high-score" style="color: #ffca28;">0</span></div>
        <div>المستوى: <span id="level" style="color: #ff007f;">1</span></div>
        <div>النمط: <span id="current-speed" style="color: #00ffff;">متوازن</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="start-screen" class="overlay-screen">
            <h2>مستعد للتحدي؟</h2>
            <div class="mode-selector">
                <button class="mode-btn active" id="mode-1p" onclick="setMode(1)">لاعب واحد</button>
                <button class="mode-btn" id="mode-2p" onclick="setMode(2)">لاعبان (1P vs 2P)</button>
            </div>
            <p>تحكم بالأسهم أو بالأزرار | P للإيقاف | Space للبدء</p>
            <button class="action-btn" onclick="startGame()">ابدأ اللعب الآن</button>
            <div class="space-hint">اضغط [ Space ] للبدء مباشرة</div>
        </div>

        <div id="pause-screen" class="overlay-screen">
            <h2>موقوف مؤقتاً</h2>
            <p>اضغط P أو الزر لمتابعة اللعب</p>
            <button class="action-btn" onclick="togglePause()">متابعة اللعب</button>
        </div>

        <div id="game-over-screen" class="overlay-screen">
            <h2>انتهى التحدي!</h2>
            <p>النتيجة النهائية: <span id="final-score" style="color:#00ff66; font-weight:bold;">0</span></p>
            <button class="action-btn" onclick="resetGame()">إعادة اللعب</button>
            <div class="space-hint">اضغط [ Space ] لإعادة اللعب فوراً</div>
        </div>
    </div>

    <div class="controls">
        <button id="sp1" onclick="setSpeed(140, 'sp1', 'كلاسيك')">كلاسيك</button>
        <button id="sp2" class="active-speed" onclick="setSpeed(85, 'sp2', 'متوازن')">متوازن</button>
        <button id="sp3" onclick="setSpeed(55, 'sp3', 'سريع جداً')">سريع جداً</button>
        <button id="sp4" onclick="setSpeed(35, 'sp4', 'السرعة القصوى')">السرعة القصوى</button>
        <button onclick="togglePause()" style="border-color:#00ffff; color:#00ffff;">إيقاف (P)</button>
    </div>

    <div class="d-pad">
        <div></div>
        <button class="d-btn" onclick="changeDirection('UP', 1)">▲</button>
        <div></div>
        <button class="d-btn" onclick="changeDirection('LEFT', 1)">◀</button>
        <div></div>
        <button class="d-btn" onclick="changeDirection('RIGHT', 1)">▶</button>
        <div></div>
        <button class="d-btn" onclick="changeDirection('DOWN', 1)">▼</button>
        <div></div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gameOverScreen = document.getElementById("game-over-screen");
        const startScreen = document.getElementById("start-screen");
        const pauseScreen = document.getElementById("pause-screen");

        // محرك الصوت التوليدي
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        const grid = 20; 
        const radius = 10;
        let gameMode = 1; // 1 Player or 2 Players
        
        let snake = [];
        let dx = grid, dy = 0;
        let snake2 = [];
        let dx2 = grid, dy2 = 0;

        let foodX = 0, foodY = 0;
        let specialFood = null;
        let particles = [];
        let obstacles = [];

        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem("local_snake_high_2026") || 0;
        let gameInterval = null;
        let currentDelay = 85; 
        let isGameOver = false;
        let isGameStarted = false;
        let isPaused = false;
        let changingDirection1 = false;
        let changingDirection2 = false;

        document.getElementById("high-score").innerText = highScore;

        function setMode(mode) {
            gameMode = mode;
            document.getElementById("mode-1p").classList.toggle("active", mode === 1);
            document.getElementById("mode-2p").classList.toggle("active", mode === 2);
        }

        function generateObstacles() {
            obstacles = [];
            if (level > 1) {
                const count = Math.min(level * 2, 10);
                for (let i = 0; i < count; i++) {
                    obstacles.push({
                        x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
                        y: Math.floor(Math.random() * (canvas.height / grid)) * grid
                    });
                }
            }
        }

        function randomFood() {
            foodX = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            foodY = Math.floor(Math.random() * (canvas.height / grid)) * grid;
            
            // عدم وضع الطعام فوق العوائق
            for (let obs of obstacles) {
                if (obs.x === foodX && obs.y === foodY) return randomFood();
            }

            if (Math.random() < 0.25 && !specialFood) {
                spawnSpecialFood();
            }
        }

        function spawnSpecialFood() {
            let sx = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            let sy = Math.floor(Math.random() * (canvas.height / grid)) * grid;
            specialFood = { x: sx, y: sy, timer: 50 };
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x + radius, y: y + radius,
                    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                    alpha: 1, color: color
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawCircularPalestine(x, y) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x + radius, y + radius, radius, 0, Math.PI * 2);
            ctx.clip(); 
            ctx.fillStyle = "white"; ctx.fillRect(x, y, grid, grid);
            ctx.fillStyle = "#000000"; ctx.fillRect(x, y, grid, 6.6);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y + 6.6, grid, 6.6);
            ctx.fillStyle = "#009639"; ctx.fillRect(x, y + 13.2, grid, 6.6);
            ctx.fillStyle = "#ff2233";
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + grid); ctx.lineTo(x + 7, y + radius); ctx.fill();
            ctx.restore();
        }

        function drawSnake2Segment(x, y) {
            ctx.save();
            ctx.fillStyle = "#00ffff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffff";
            ctx.beginPath();
            ctx.arc(x + radius, y + radius, radius - 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawCircularTarget(x, y) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x + radius, y + radius, radius, 0, Math.PI * 2);
            ctx.clip();
            ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y, grid, grid);
            ctx.fillStyle = "#0038a8"; ctx.fillRect(x, y + 2, grid, 3); ctx.fillRect(x, y + 15, grid, 3);
            ctx.beginPath(); ctx.arc(x + radius, y + radius, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawObstacles() {
            for (let obs of obstacles) {
                ctx.save();
                ctx.fillStyle = "#ff0055";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff0055";
                ctx.fillRect(obs.x + 2, obs.y + 2, grid - 4, grid - 4);
                ctx.restore();
            }
        }

        function main() {
            if (!isGameStarted || isGameOver || isPaused) return;

            changingDirection1 = false;
            changingDirection2 = false;

            // تحديث اللاعب الأول
            const head1 = { x: snake[0].x + dx, y: snake[0].y + dy };
            if (checkCollision(head1, snake) || checkObstacleCollision(head1)) { endGame(); return; }
            snake.unshift(head1);

            // تحديث اللاعب الثاني إذا كان مفعل
            let head2 = null;
            if (gameMode === 2) {
                head2 = { x: snake2[0].x + dx2, y: snake2[0].y + dy2 };
                if (checkCollision(head2, snake2) || checkObstacleCollision(head2)) { endGame(); return; }
                snake2.unshift(head2);
            }

            // أكل الطعام لـ P1
            if (head1.x === foodX && head1.y === foodY) {
                handleEat(foodX, foodY);
            } else if (specialFood && head1.x === specialFood.x && head1.y === specialFood.y) {
                handleEatSpecial();
            } else { snake.pop(); }

            // أكل الطعام لـ P2
            if (gameMode === 2 && head2) {
                if (head2.x === foodX && head2.y === foodY) {
                    handleEat(foodX, foodY);
                } else if (specialFood && head2.x === specialFood.x && head2.y === specialFood.y) {
                    handleEatSpecial();
                } else { snake2.pop(); }
            }

            if (specialFood) {
                specialFood.timer--;
                if (specialFood.timer <= 0) specialFood = null;
            }

            // الرسم
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawObstacles();
            drawCircularTarget(foodX, foodY);
            if (specialFood) {
                ctx.fillStyle = "#ffca28"; ctx.beginPath();
                ctx.arc(specialFood.x + radius, specialFood.y + radius, radius, 0, Math.PI * 2); ctx.fill();
            }

            for (let s of snake) drawCircularPalestine(s.x, s.y);
            if (gameMode === 2) {
                for (let s of snake2) drawSnake2Segment(s.x, s.y);
            }

            updateAndDrawParticles();
        }

        function handleEat(x, y) {
            score += 10;
            playSound(600, "sine", 0.1);
            createParticles(x, y, "#00ff66");
            updateScore();
            randomFood();
        }

        function handleEatSpecial() {
            score += 30;
            playSound(900, "square", 0.15);
            createParticles(specialFood.x, specialFood.y, "#ffca28");
            specialFood = null;
            updateScore();
        }

        function updateScore() {
            document.getElementById("score").innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("local_snake_high_2026", highScore);
                document.getElementById("high-score").innerText = highScore;
            }
            let newLevel = Math.floor(score / 50) + 1;
            if (newLevel !== level) {
                level = newLevel;
                document.getElementById("level").innerText = level;
                generateObstacles();
            }
        }

        function checkCollision(head, targetSnake) {
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) return true;
            for (let i = 0; i < targetSnake.length; i++) {
                if (head.x === targetSnake[i].x && head.y === targetSnake[i].y) return true;
            }
            return false;
        }

        function checkObstacleCollision(head) {
            for (let obs of obstacles) {
                if (head.x === obs.x && head.y === obs.y) return true;
            }
            return false;
        }

        function drawGrid() {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.02)";
            for (let i = 0; i < canvas.width; i += grid) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        function changeDirection(dir, player = 1) {
            if (player === 1 && !changingDirection1) {
                if (dir === 'LEFT' && dx === 0) { dx = -grid; dy = 0; changingDirection1 = true; }
                if (dir === 'UP' && dy === 0) { dx = 0; dy = -grid; changingDirection1 = true; }
                if (dir === 'RIGHT' && dx === 0) { dx = grid; dy = 0; changingDirection1 = true; }
                if (dir === 'DOWN' && dy === 0) { dx = 0; dy = grid; changingDirection1 = true; }
            } else if (player === 2 && !changingDirection2) {
                if (dir === 'LEFT' && dx2 === 0) { dx2 = -grid; dy2 = 0; changingDirection2 = true; }
                if (dir === 'UP' && dy2 === 0) { dx2 = 0; dy2 = -grid; changingDirection2 = true; }
                if (dir === 'RIGHT' && dx2 === 0) { dx2 = grid; dy2 = 0; changingDirection2 = true; }
                if (dir === 'DOWN' && dy2 === 0) { dx2 = 0; dy2 = grid; changingDirection2 = true; }
            }
        }

        // دعم إيماءات شاشات اللمس (Touch Gestures)
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);
        canvas.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) changeDirection('RIGHT', 1);
                else changeDirection('LEFT', 1);
            } else {
                if (diffY > 0) changeDirection('DOWN', 1);
                else changeDirection('UP', 1);
            }
        }, false);

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") changeDirection('LEFT', 1);
            if (e.key === "ArrowUp") changeDirection('UP', 1);
            if (e.key === "ArrowRight") changeDirection('RIGHT', 1);
            if (e.key === "ArrowDown") changeDirection('DOWN', 1);

            // مفاتيح التحكم للاعب الثاني WASD
            if (e.key === "a" || e.key === "A") changeDirection('LEFT', 2);
            if (e.key === "w" || e.key === "W") changeDirection('UP', 2);
            if (e.key === "d" || e.key === "D") changeDirection('RIGHT', 2);
            if (e.key === "s" || e.key === "S") changeDirection('DOWN', 2);

            if (e.code === "KeyP") togglePause();
            if (e.code === "Space") {
                e.preventDefault();
                if (!isGameStarted || isGameOver) startGame();
            }
        });

        function togglePause() {
            if (!isGameStarted || isGameOver) return;
            isPaused = !isPaused;
            pauseScreen.style.setProperty("display", isPaused ? "flex" : "none", "important");
            playSound(300, "triangle", 0.1);
        }

        function setSpeed(delay, btnId, speedText) {
            currentDelay = delay;
            document.getElementById("current-speed").innerText = speedText;
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active-speed'));
            document.getElementById(btnId).classList.add('active-speed');
            if (isGameStarted && !isGameOver) {
                clearInterval(gameInterval);
                gameInterval = setInterval(main, currentDelay);
            }
        }

        function startGame() {
            snake = [{ x: 160, y: 200 }, { x: 140, y: 200 }, { x: 120, y: 200 }];
            dx = grid; dy = 0;
            if (gameMode === 2) {
                snake2 = [{ x: 160, y: 100 }, { x: 140, y: 100 }, { x: 120, y: 100 }];
                dx2 = grid; dy2 = 0;
            }
            score = 0; level = 1;
            particles = []; specialFood = null;
            document.getElementById("score").innerText = score;
            document.getElementById("level").innerText = level;
            isGameOver = false; isGameStarted = true; isPaused = false;
            
            startScreen.style.setProperty("display", "none", "important");
            gameOverScreen.style.setProperty("display", "none", "important");
            pauseScreen.style.setProperty("display", "none", "important");
            
            generateObstacles();
            randomFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(main, currentDelay);
        }

        function endGame() {
            isGameOver = true;
            playSound(150, "sawtooth", 0.4);
            clearInterval(gameInterval);
            document.getElementById("final-score").innerText = score;
            gameOverScreen.style.setProperty("display", "flex", "important");
        }

        function resetGame() { startGame(); }
    </script>
</body>
</html>
